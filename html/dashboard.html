<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ICT Research Hub | Dashboard</title>
  <link rel="icon" type="image/png" href="../images/icon.png" />
  <style>
    body {
      /* Background gradient styling */
      background: linear-gradient(to bottom, #CDB4DB, #FFC8DD, #FFAFCC, #BDE0FE, #A2D2FF);
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }

    .container { /* Dashboard Style */
      width: 500px;
      margin: 50px auto;
      border: 1px solid white;
      background: rgba(255, 255, 255, 0.3);
      padding: 20px;
      border-radius: 10px;
    }

    .container h1 {
      text-align: center;
      margin-bottom: 20px;
      color: gray;
    }

    .profile-pic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }

    input,
    button {
      width: 100%;
      padding: 8px 1px 8px 1px;
      margin: 10px 0;
    }

    .msg {
      margin-top: 10px;
      text-align: center;
    }

    a {
      text-decoration: none;
      color: #333;
    }

    p {
      text-align: center;
    }

    .home {
      border: 1px solid #333;
      background-color: blue;
      border-radius: 8px;
      font-size: 24px;
      text-align: center;
    }

    .logout {
      border: 1px solid #333;
      background-color: red;
      border-radius: 8px;
      font-size: 24px;
    }

  </style>
</head>

<body>
  <div class="container">
    <h1>ICT Research Hub</h1>
    <h2>Dashboard</h2>
    <div id="profile"></div>

    <form id="updateForm" enctype="multipart/form-data">
      <label>Nickname</label>
      <input type="text" name="nickname" id="nickname">

      <label>New Password</label>
      <input type="password" name="new_password" id="new_password">

      <label>Confirm Password</label>
      <input type="password" name="confirm_password" id="confirm_password">

      <label>Profile Picture</label>
      <input type="file" name="profile_pic" id="profile_pic" accept="image/*">

      <button type="submit">Update Profile</button>
    </form>

    <div class="msg" id="msg"></div>
    <p><a href="home.html" class="home">🏠 Home</a> | <a href="../php/logout.php" onclick="logout(); return false;" class="logout">🚪 Logout</a></p>
  </div>

  <script>
    async function loadUser() {
      let res = await fetch("../php/user.php"); // Find the account on data/users.json
      let data = await res.json();
      if (data.user) {
        let u = data.user;
        document.getElementById("profile").innerHTML = `
          <img src="${u.profile_pic || '../images/icon.png'}" class="profile-pic"><br>
          <strong>Username: @${u.username} (${u.nickname})</strong><br>
          <small>Email:<a href="mailto:${u.email}"> ${u.email}</small>
        `;
        document.getElementById("nickname").value = u.nickname || "";
      } else {
        window.location.href = "login.html";
      }
    }

    document.getElementById("updateForm").addEventListener("submit", async (e) => { // If the user update their profile
      e.preventDefault();
      let formData = new FormData(document.getElementById("updateForm"));

      let res = await fetch("../php/update.php", {
        method: "POST",
        body: formData
      });
      let data = await res.json();
      if (data.success) {
        document.getElementById("msg").innerText = "✅ Profile updated!";
        loadUser();
      } else {
        document.getElementById("msg").innerText = "❌ " + data.error;
      }
    });

    async function logout() {
      await fetch("../php/logout.php");
      localStorage.removeItem("loggedInUser");
      window.location.href = "login.html";
    }

    loadUser();
  </script>
</body>

</html>
