<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ICT Research Hub | Register</title>
    <link rel="icon" type="image/png" href="../images/icon.png" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body>
    <div class="auth-container">
      <h2>ICT Research Hub</h2>
      <div class="input-group">
        <input type="text" id="username" placeholder=" " required />
        <label for="username">Username</label>
      </div>
      <div class="input-group">
        <input type="email" id="email" placeholder=" " required />
        <label for="email">Email</label>
      </div>
      <div class="input-group password-group">
        <input
          type="password"
          id="password"
          placeholder=" "
          autocomplete="current-password"
          required
        />
        <label for="password">Password</label>
        <span class="toggle-password" onclick="togglePassword(this)"></span>
      </div>
      <button onclick="register()">Register</button>
      <p>
        Already have an account? <a href="login.html" class="account">Login</a>
      </p>
      <div id="msg"></div>
    </div>

    <script src="../javascript/maintenance.js"></script>
    <script>
      async function register() {
        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const msg = document.getElementById("msg");
        msg.innerText = "";
        if (!username || !email || !password) {
          msg.innerText = "Please fill in all fields.";
          return;
        }
        let res = await fetch("../php/register.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password }),
        });
        let data = await res.json();
        if (data.success) {
          localStorage.setItem("loggedInUser", JSON.stringify(data.user));
          window.location.href = "home.html";
        } else {
          msg.innerText = data.error;
        }
      }

      function togglePassword(el) {
        const input = el.parentElement.querySelector("input");
        if (input.type === "password") {
          input.type = "text";
          el.classList.add("show");
        } else {
          input.type = "password";
          el.classList.remove("show");
        }
      }

      if (typeof maintenanceMode !== "undefined" && maintenanceMode === true) {
        if (!window.location.href.includes("maintenance.html")) {
          window.location.href = "../html/maintenance.html";
        }
      }
    </script>
  </body>
</html>
