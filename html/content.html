<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICT Research Hub | Research</title>
    <link rel="stylesheet" href="../css/content.css" /> <!-- Link to external CSS for styling(content.css) -->
    <link rel="icon" type="image/png" href="../images/icon.png" /> <!-- Website Icon(Tab Icon) -->
</head>
<body>

    <div class="topbar" id="topbar"></div>

    <!-- Sidebar Toggle Button (open/closes sidebar) -->
    <button class="toggle-btn" id="toggleButton" onclick="toggleSidebar()">&#9776; <a href="home.html" class="words" id="words">ICT Research Hub</a></button>

    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <a href="content.html">ICT Research</a>
        <a href="purpose.html">Purpose</a>
        <a href="creator.html">Researchers</a>
        <h4>Coming Soon...</h4>
    </div>
    
    <!-- Main Content -->
    <div class="container">
        <h1>ICT Research Hub</h1>

        <!-- Search and Filter Form -->
        <form id="searchForm">
            <input type="text" id="searchInput" placeholder="Search ICT Research..."/>
            <select id="yearSelect">
                <option value="">All Years</option>
                <!-- Options will be added dynamically by JavaScript -->
            </select>
        </form>

        <!-- Upload Form for new PDF research -->
        <div class="upload">
            <form action="../php/upload.php" method="post" enctype="multipart/form-data">
                <input type="text" name="title" placeholder="Title" required>
                <select name="year" required>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="2020">2020</option>
                    <option value="2019">2019</option>
                    <option value="2018">2018</option>
                    <option value="2017">2017</option>
                    <option value="2016">2016</option>
                    <option value="2015">2015</option>
                    <!-- More years available -->
                </select>
                <input type="file" name="pdf_file" accept="application/pdf" required>
                <!-- RRL PDF Uploader Input -->
                <button type="submit" class="upload-btn">Upload PDF</button>
                <!-- Upload Button -->
            </form>
        </div>

        <div id="pdfList"></div> <!-- RRL List -->
    </div>

    <script src="../javascript/content.js"></script>
    <script>
        async function loadUser() {
          let res = await fetch("../php/user.php");
          let data = await res.json();
          if (data.user) {
            let u = data.user;
            document.getElementById("topbar").innerHTML = `
              <img src="${u.profile_pic || '../images/icon.png'}" class="profile-pic" style="width:30px;height:30px;border-radius:50%">
              <span class="dashb"><a href="dashboard.html">${u.nickname || u.username}</a></span>
            `;
          } else {
            window.location.href = "login.html";
          }
        }
      
        async function logout() {
          await fetch("../php/logout.php");
          localStorage.removeItem("loggedInUser");
          window.location.href = "login.html";
        }
      
        loadUser();
      </script>
</body>
</html>
