<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TechieSources | Login</title>
    <link rel="icon" type="image/png" href="../images/icon.png" />
    <link rel="stylesheet" href="../css/login.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>

  <body>
    <div class="auth-container">
      <h2>TechieSources</h2>
      <div class="input-group">
        <input type="text" id="username" placeholder=" " required />
        <label for="username">Username or Email</label>
      </div>
      <div class="input-group password-group">
        <input
          type="password"
          id="password"
          placeholder=" "
          autocomplete="current-password"
          required
        />
        <label for="password">Password</label>
        <span class="toggle-password" onclick="togglePassword(this)"></span>
      </div>
      <button onclick="login()">Login</button>
      <p>
        Don't have an account?
        <a href="register.html" class="account">Register</a>
      </p>
      <div id="msg"></div>
    </div>

    <script src="../javascript/maintenance.js"></script>
    <script>
      fetch("../php/session_check.php")
      .then(response => response.text())
      .then(status => {
        if (status.trim() === 'logged_in') {
          window.location.href = "home.html";
        }
      })
      .catch(err => console.error(err));
    </script>
    <script>
      async function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const msg = document.getElementById("msg");
        msg.innerText = "";
        if (!username || !password) {
          msg.innerText = "Please fill in both fields.";
          return;
        }
        let res = await fetch("../php/login.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        let data = await res.json();
        if (data.success) {
          localStorage.setItem("loggedInUser", JSON.stringify(data.user));
          window.location.href = "home.html";
        } else {
          msg.innerText = data.error;
        }
      }

      function togglePassword(el) {
        const input = el.parentElement.querySelector("input");
        if (input.type === "password") {
          input.type = "text";
          el.classList.add("show");
        } else {
          input.type = "password";
          el.classList.remove("show");
        }
      }

      if (typeof maintenanceMode !== "undefined" && maintenanceMode === true) {
        if (!window.location.href.includes("maintenance.html")) {
          window.location.href = "../html/maintenance.html";
        }
      }
    </script>
  </body>
</html>
