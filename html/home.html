<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICT Research Hub</title>
    <link rel="stylesheet" href="../css/home.css" /> <!-- Link to external CSS for styling(home.css) -->
    <link rel="icon" type="image/png" href="../images/icon.png" /> <!-- Website Icon(Tab Icon) -->
</head>

<body>

    <div class="topbar" id="topbar"></div> <!-- Account -->

    <!-- Sidebar Toggle Button (open/closes sidebar) -->
    <button class="toggle-btn" id="toggleButton" onclick="toggleSidebar()">&#9776; <a href="home.html" class="words" id="words">ICT Research Hub</a></button>
    
    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <a href="content.html">ICT Research</a>
        <a href="purpose.html">Purpose</a>
        <a href="creator.html">Researchers</a>
        <h4>Coming Soon...</h4>
    </div>

    <!-- Main Content -->
   <div class="container" id="main">

    <div class="logo">
        <span class="indigo">I</span>
        <span class="cyan">C</span>
        <span class="amber">T</span>
        <span class="green">Research</span>
        <span class="gray">Hub</span>
    </div>
 </div>



    <script src="../javascript/home.js"></script>
    <script>
      // Account functions (Sign In/Up, Dashboard, etc.)
        async function loadUser() {
          let res = await fetch("../php/user.php"); // Find the account on data/users.json
          let data = await res.json();
          if (data.user) {
            let u = data.user;
            document.getElementById("topbar").innerHTML = `
              <img src="${u.profile_pic || '../images/icon.png'}" class="profile-pic" style="width:30px;height:30px;border-radius:50%">
              <span class="dashb"><a href="dashboard.html">${u.nickname || u.username}</a></span>
            `;
          } else {
            window.location.href = "login.html";
          }
        }
      
        async function logout() {
          await fetch("../php/logout.php");
          localStorage.removeItem("loggedInUser");
          window.location.href = "login.html";
        }
      
        loadUser();
      </script>
</body>

</html>
