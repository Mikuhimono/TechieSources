<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Research Hub | Creators</title>
    <link rel="stylesheet" href="../css/creator.css"> <!-- Link to external CSS for styling(creator.css) -->
    <link rel="icon" type="img/png" href="../images/icon.png"> <!-- Website Icon(Tab Icon) -->
</head>
<body>

    <div class="topbar" id="topbar"></div>

    <!-- Sidebar Toggle Button (open/closes sidebar) -->
    <button class="toggle-btn" id="toggleButton" onclick="toggleSidebar()">&#9776; <a href="home.html" class="words" id="words">ICT Research Hub</a></button>

    <!-- Sidebar Navigation -->
    <div class="sidebar" id="sidebar">
        <a href="content.html">ICT Research</a>
        <a href="purpose.html">Purpose</a>
        <a href="creator.html">Researchers</a>
        <h4>Coming Soon...</h4>
    </div>

    <!-- Creator List -->
    <div class="container">
        <h1 class="title" id="title">Meet the Researchers</h1>
        <div id="creators-list" class="creators-list"></div>
    </div>


    <script src="../javascript/creator.js"></script>
    <script>
        async function loadUser() {
          let res = await fetch("../php/user.php");
          let data = await res.json();
          if (data.user) {
            let u = data.user;
            document.getElementById("topbar").innerHTML = `
              <img src="${u.profile_pic || '../images/icon.png'}" class="profile-pic" style="width:30px;height:30px;border-radius:50%">
              <span class="dashb"><a href="dashboard.html">${u.nickname || u.username}</a></span>
            `;
          } else {
            window.location.href = "login.html";
          }
        }
      
        async function logout() {
          await fetch("../php/logout.php");
          localStorage.removeItem("loggedInUser");
          window.location.href = "login.html";
        }
      
        loadUser();
      </script>
</body>
</html>
